<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakib Al Hasan Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <span class="badge-75">75</span>
            <span class="brand-name">SHAKIB AL HASAN</span>
        </div>
        <nav class="nav-links">
            <a href="#about">About</a>
            <a href="#career">Career</a>
            <a href="#records">Records</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="nav-right">
            <a href="#contact" class="btn-get-in-touch">Get in touch</a>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <div class="hero-content"></div>
        <div class="hero-image-container">
            <div class="image-card">
                <!-- Using contain so the full image and full body remain visible -->
                <img src="images/shakib-al-hasan.png" alt="Shakib Al Hasan">
                <div class="image-caption-box">
                    <h3>ICC #1 ALL-ROUNDER</h3>
                    <p>Top-ranked in Tests, ODIs & T20Is at once (2015)</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
